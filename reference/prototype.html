<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9eee3; --grid:#cfdacb; --ink:#2c3133; --pencil:#2d5c9e; --red:#b5352a; --muted:#78837d; --steel:#a7aeb3;
  --panel:#dfe5d8; --line:#c3ccbe; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#143562; --grid:#24497a; --ink:#e6edf6; --pencil:#9ccbff; --red:#ff8574; --muted:#8fa6c4; --steel:#c9d3de;
  --panel:#0f2b52; --line:#2a4f80; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#143562; --grid:#24497a; --ink:#e6edf6; --pencil:#9ccbff; --red:#ff8574; --muted:#8fa6c4; --steel:#c9d3de;
  --panel:#0f2b52; --line:#2a4f80; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:15px/1.4 Barlow,system-ui,-apple-system,sans-serif;
  display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
header .t{flex:1;min-width:0}
h1{font:700 26px/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:13px}
.icon{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 20px/1 Barlow,sans-serif;cursor:pointer}
.icon:disabled{opacity:.3}
#stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px}
canvas{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 1.5px var(--line)}
#hint{margin:6px 14px 0;color:var(--muted);font-size:13px;min-height:18px}
.controls{padding:6px 14px 12px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:52px 30px 1fr 30px 58px;align-items:center;gap:6px}
.row label{font:600 15px "Barlow Condensed",sans-serif;color:var(--muted)}
.row output{font:600 18px "Barlow Condensed",sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.nudge{height:30px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;padding:0}
input[type=range]{width:100%;accent-color:var(--pencil);height:30px}
.bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tray{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--pencil);background:transparent;color:var(--pencil);font:600 14px Barlow,sans-serif;cursor:pointer}
.chip svg{width:34px;height:10px} .chip line{stroke:currentColor;stroke-width:3.5;stroke-linecap:round}
.chip.on{opacity:.55;border-style:dashed} .chip.sel{opacity:1;background:var(--pencil);color:var(--panel);border-style:solid}
.none{color:var(--muted);font-size:13px;align-self:center}
.ghost{white-space:nowrap;height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:500 14px Barlow,sans-serif;cursor:pointer}
  .actions{display:grid;grid-template-columns:auto 1fr;gap:8px}
#solve{height:46px;border-radius:23px;padding:0 20px;font-size:15px}
#launch{height:46px;border:0;border-radius:23px;background:var(--red);color:#fff;font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.3px;cursor:pointer}
#launch:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--pencil);outline-offset:2px}
#win{position:absolute;inset:10px 22px auto 22px;padding:12px 14px!important;background:var(--paper);border:2px solid var(--red);border-radius:10px;padding:16px 18px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#win[hidden]{display:none}
#win h2{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:0 0 4px;color:var(--red)}
#win p{margin:0 0 12px;color:var(--muted)}
#win .btns{display:flex;gap:8px;justify-content:center}
#go{white-space:nowrap;height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--red);color:#fff;font:600 15px Barlow,sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <button class="icon" id="prev" aria-label="Previous level">‹</button>
  <div class="t"><h1 id="lvname">Bank Shot</h1><div class="sub" id="lvnum"></div></div>
  <button class="icon" id="next" aria-label="Next level">›</button>
</header>
<div id="stage">
  <canvas id="board" aria-label="Game board: launch the ball into the glass"></canvas>
  <div id="win" hidden role="status"><h2 id="winTitle"></h2><p id="winDetail"></p>
    <div class="btns"><button class="ghost" id="again">Replay level</button><button id="go">Next level</button></div></div>
</div>
<div>
  <div id="hint"></div>
  <div class="controls">
    <div class="row"><label for="angle">Angle</label><button class="nudge" data-nudge="a:-0.1" aria-label="Decrease angle">−</button>
      <input type="range" id="angle" min="0" max="90" step="0.1" value="52"><button class="nudge" data-nudge="a:0.1" aria-label="Increase angle">+</button><output id="angleVal"></output></div>
    <div class="row"><label for="power">Power</label><button class="nudge" data-nudge="p:-0.1" aria-label="Decrease power">−</button>
      <input type="range" id="power" min="0" max="100" step="0.1" value="45"><button class="nudge" data-nudge="p:0.1" aria-label="Increase power">+</button><output id="powerVal"></output></div>
    <div class="bottom"><div id="tray"></div><button class="ghost" id="clear">Clear trails</button></div>
    <div class="actions"><button class="ghost" id="solve">Solve</button><button id="launch">Launch</button></div>
  </div>
</div>

function win() {
  done = true;
  if (li + 1 > unlocked && li + 1 < LEVELS.length) { unlocked = li + 1; try { localStorage.setItem('bounce-unlocked', String(unlocked)); } catch (e) {} }
  $('next').disabled = li >= unlocked;
  $('winTitle').textContent = solved ? 'Here’s one way in' : tries === 1 ? 'In the glass on the first try' : `In the glass in ${tries} tries`;
  $('winDetail').textContent = `Angle ${(+angleIn.value).toFixed(1)}°, power ${(+powerIn.value).toFixed(1)}`;
  const last = li === LEVELS.length - 1;
  $('go').textContent = last ? 'Play again' : 'Next level';
  $('go').onclick = () => loadLevel(last ? li : li + 1);
  $('again').textContent = solved ? 'Try it yourself' : 'Replay level';
  $('win').hidden = false;
}

// ---------- drawing ----------
function resize() {
  const wrap = $('stage'), r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  draw();
}
new ResizeObserver(resize).observe($('stage'));

function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(path, n, c, w, alpha) {
  if (n < 2) return; ctx.globalAlpha = alpha; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
  ctx.moveTo(path[0][0], path[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(path[i][0], path[i][1]); ctx.stroke(); ctx.globalAlpha = 1;
}
const ends = pieceEnds;
function deadLine(x1, y1, x2, y2) {
  line(x1, y1, x2, y2, colors.muted, 6);
  const L = Math.hypot(x2 - x1, y2 - y1); if (!L) return;
  const ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  ctx.strokeStyle = colors.paper; ctx.lineWidth = 1.4; ctx.beginPath();
  for (let d = 4; d < L - 2; d += 6) { const cx = x1 + ux * d, cy = y1 + uy * d; ctx.moveTo(cx - 2.5 * uy - 2 * ux, cy + 2.5 * ux - 2 * uy); ctx.lineTo(cx + 2.5 * uy + 2 * ux, cy - 2.5 * ux + 2 * uy); }
  ctx.stroke();
}

function draw() {
  if (!level) return;
  ctx.lineCap = 'round';
  ctx.fillStyle = colors.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = colors.grid; ctx.lineWidth = 0.6; ctx.beginPath();
  for (let x = 20; x < W; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); }
  for (let y = 20; y < GROUND; y += 20) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.lineWidth = 1.1; ctx.beginPath();
  for (let x = 100; x < W; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); }
  for (let y = 100; y < GROUND; y += 100) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // trails, oldest faintest
  trails.forEach((t, i) => poly(t.path, t.path.length, t.ok ? colors.red : colors.pencil, 1.4, 0.16 + 0.14 * (i + 4 - trails.length)));

  // dead surfaces: box, ground, fixed obstacles
  ctx.strokeStyle = colors.muted; ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, W - 3, GROUND - 1.5);
  line(0, GROUND, W, GROUND, colors.muted, 4);
  for (const s of level.fixed) deadLine(s[0], s[1], s[2], s[3]);

  // where the last shot died
  const lt = trails[trails.length - 1];
  if (lt && !lt.ok && !flight) { const [ex, ey] = lt.path[lt.path.length - 1]; ctx.strokeStyle = colors.red; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 5, ey - 5); ctx.lineTo(ex + 5, ey + 5); ctx.moveTo(ex + 5, ey - 5); ctx.lineTo(ex - 5, ey + 5); ctx.stroke(); }

  // glass
  const g = level.glass, gl = g.x - g.w / 2, gr = g.x + g.w / 2, base = g.base ?? GROUND, rim = base - g.h;
  ctx.fillStyle = colors.red; ctx.globalAlpha = 0.1; ctx.fillRect(gl, rim, g.w, g.h); ctx.globalAlpha = 1;
  line(gl, rim, gl, base, colors.red, 3); line(gr, rim, gr, base, colors.red, 3); line(gl - 8, base, gr + 8, base, colors.red, 3);

  // pieces
  for (const p of placed) {
    if (!p.onBoard) continue;
    const [x1, y1, x2, y2] = ends(p);
    line(x1, y1, x2, y2, colors.pencil, 6);
    if (p === selected) {
      ctx.globalAlpha = 0.25; line(x1, y1, x2, y2, colors.pencil, 22); ctx.globalAlpha = 1;
      ctx.fillStyle = colors.paper; ctx.strokeStyle = colors.pencil; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x2, y2, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x2, y2, 5, -2.2, 1.4); ctx.stroke();
      ctx.fillStyle = colors.pencil; ctx.font = '600 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
      const deg = ((-p.deg % 180) + 180) % 180; ctx.fillText(deg + '°', p.x, p.y - 16);
    }
  }

  // launcher
  const ang = +angleIn.value * Math.PI / 180, L = LAUNCH;
  ctx.fillStyle = colors.muted; ctx.beginPath(); ctx.moveTo(L.x - 14, GROUND); ctx.lineTo(L.x + 14, GROUND); ctx.lineTo(L.x + 4, L.y); ctx.lineTo(L.x - 4, L.y); ctx.fill();
  line(L.x, L.y, L.x + Math.cos(ang) * 26, L.y - Math.sin(ang) * 26, colors.ink, 6);

  // aim preview: first 0.3 s of free flight only
  if (!flight && !done) {
    const sp = speedFor(+powerIn.value), vx = Math.cos(ang) * sp, vy = -Math.sin(ang) * sp;
    ctx.fillStyle = colors.ink;
    for (let t = 0.03; t <= 0.3; t += 0.03) {
      ctx.globalAlpha = 1 - t * 2.6; ctx.beginPath(); ctx.arc(L.x + vx * t, L.y + vy * t + 450 * t * t, 2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ball
  let bx = L.x, by = L.y;
  if (flight && flight.idx != null) {
    poly(flight.res.path, flight.idx + 1, colors.pencil, 2, 0.95);
    [bx, by] = flight.res.path[flight.idx];
  } else if (trails.length && done) { const t = trails[trails.length - 1].path; [bx, by] = t[t.length - 1]; }
  else if (lt && !lt.ok) { bx = L.x; by = L.y; }
  ctx.fillStyle = colors.steel; ctx.beginPath(); ctx.arc(bx, by, R, 0, 7); ctx.fill();
  ctx.strokeStyle = colors.ink; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(bx - 2.6, by - 2.6, 2.4, 0, 7); ctx.fill();

  // hud
  ctx.fillStyle = colors.ink; ctx.textAlign = 'left'; ctx.font = '600 15px "Barlow Condensed", sans-serif';
  ctx.fillText(`Try ${String(tries).padStart(2, '0')}`, 12, 24);
  ctx.fillStyle = colors.muted; ctx.font = '500 13px "Barlow Condensed", sans-serif';
  ctx.fillText(`${(+angleIn.value).toFixed(1)}°   power ${(+powerIn.value).toFixed(1)}`, 12, 42);
}

// ---------- input ----------
let drag = null;
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function distSeg(px, py, x1, y1, x2, y2) {
  const ex = x2 - x1, ey = y2 - y1, L2 = ex * ex + ey * ey; let u = ((px - x1) * ex + (py - y1) * ey) / L2; u = Math.max(0, Math.min(1, u));
  return Math.hypot(px - x1 - ex * u, py - y1 - ey * u);
}
cv.addEventListener('pointerdown', e => {
  if (flight) return;
  const p = pt(e); cv.setPointerCapture(e.pointerId);
  if (selected) { const [, , x2, y2] = ends(selected); if (Math.hypot(p.x - x2, p.y - y2) < 22) { drag = { mode: 'rot' }; return; } }
  const hit = placed.filter(q => q.onBoard).find(q => { const s = ends(q); return distSeg(p.x, p.y, ...s) < 16; });
  if (hit) { selected = hit; drag = { mode: 'move', ox: p.x - hit.x, oy: p.y - hit.y }; renderTray(); draw(); return; }
  if (Math.hypot(p.x - LAUNCH.x, p.y - LAUNCH.y) < 90 && !done) { drag = { mode: 'aim' }; aimTo(p); return; }
  if (selected) { selected = null; renderTray(); draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return; const p = pt(e);
  if (drag.mode === 'move') { selected.x = Math.max(10, Math.min(W - 10, p.x - drag.ox)); selected.y = Math.max(10, Math.min(GROUND - 10, p.y - drag.oy)); }
  else if (drag.mode === 'rot') { const a = Math.atan2(p.y - selected.y, p.x - selected.x); selected.deg = Math.round(a * 180 / Math.PI); }
  else if (drag.mode === 'aim') aimTo(p);
  draw();
});
const end = () => { if (drag && drag.mode === 'aim') draw(); drag = null; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
function aimTo(p) {
  const dx = p.x - LAUNCH.x, dy = LAUNCH.y - p.y; // point where you want it to go
  let a = Math.atan2(dy, dx) * 180 / Math.PI;
  if (dx < 0) a = dy > 0 ? 90 : 0;
  a = Math.max(0, Math.min(90, a));
  const pw = Math.max(0, Math.min(100, (Math.hypot(dx, dy) - 20) / 2.6));
  angleIn.value = a.toFixed(1); powerIn.value = pw.toFixed(1); updateReadout(); draw();
}
document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); launch(); } });

loadLevel(unlocked);
document.fonts && document.fonts.ready.then(draw);
})();

</script>
</body>
</html>
