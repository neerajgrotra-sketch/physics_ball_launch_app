<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phone-app behaviour: fill the screen edge to edge (the app pads for the notch and home bar
         itself), and no pinch or double-tap zoom, so drags on the board aim and move bars instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Bank Shot</title>
    <meta name="description" content="Place the bars, launch the ball, bounce it into the glass." />

    <!-- "Add to Home Screen" opens it full screen like an installed app. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bank Shot" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#dfe5d8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f2b52" media="(prefers-color-scheme: dark)" />

    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        background: #dfe5d8;
        /* No rubber-band scroll or pull-to-refresh: the page never moves, only the game does. */
        overflow: hidden;
        overscroll-behavior: none;
        /* Taps are taps: no 300 ms delay, grey flash, text selection or long-press callout. */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0f2b52; }
      }
      /* The real visible height on phones (100% can include the area under Safari's toolbar). */
      body { height: 100dvh; }
      #root { display: flex; height: 100%; flex: 1; }
      /* The board handles every touch itself (aim, move, rotate). */
      canvas { touch-action: none; }

      /* Shown until the app replaces it (the game engine is ~10 MB, so this can take a few seconds). */
      /* The launch screen: the same rounded icon, size and spot the intro (components/splash) opens on. */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot img { width: 150px; height: 150px; }
      #boot span { position: absolute; top: calc(50% + 100px); left: 0; right: 0; text-align: center;
        font: 600 15px -apple-system, system-ui, sans-serif; color: #78837d; opacity: 0; animation: boot-wait 0.4s 1.5s forwards; }
      @keyframes boot-wait { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) { #boot span { color: #8fa6c4; } }
      /* Any startup error is printed on screen, so a phone without dev tools can still say what broke. */
      #boot-error { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
        padding: 12px; border-radius: 10px; background: #b5352a; color: #fff; font: 13px/1.4 ui-monospace, Menlo, monospace;
        white-space: pre-wrap; word-break: break-word; max-height: 50vh; overflow: auto; z-index: 9999;
        -webkit-user-select: text; user-select: text; }
    </style>
    <script>
      (function () {
        function show(msg) {
          var box = document.getElementById('boot-error');
          if (!box) {
            box = document.createElement('div'); box.id = 'boot-error'; document.body.appendChild(box);
            box.addEventListener('click', function () { box.remove(); }); // tap to dismiss
          }
          box.textContent = 'Bank Shot hit an error (tap to close):\n' + msg + '\n\n' + navigator.userAgent;
        }
        window.__bankShotError = function (e) { show((e && (e.stack || e.message)) || String(e)); };
        window.addEventListener('error', function (e) {
          // A script that failed to load (only ours are on this page).
          if (e.target && e.target !== window && e.target.src) { show('Script failed to load: ' + e.target.src); return; }
          // Only errors thrown by the game's own scripts. In-app browsers inject their own scripts, whose
          // errors arrive as a bare "Script error." with no file; those aren't ours, so stay quiet.
          if (!e.filename || e.filename.indexOf(location.origin) !== 0) return;
          show((e.error && e.error.stack) || e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) { window.__bankShotError(e.reason); });

        // A drag on the board is a game move (aim, move or rotate a bar). Without this, iOS also treats
        // it as a page drag, which in an in-app browser sheet pulls the whole sheet down to close it.
        // Non-passive so preventDefault is allowed; sliders and the level list scroll as normal.
        document.addEventListener('touchmove', function (e) {
          if (e.target && e.target.closest && e.target.closest('canvas, [data-board]')) e.preventDefault();
        }, { passive: false });
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to play Bank Shot.</noscript>
    <div id="root"><div id="boot"><img src="/icons/splash-icon.png" alt="Bank Shot" /><span>Loading…</span></div></div>
  </body>
</html>
